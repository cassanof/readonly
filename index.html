<html>
  <canvas id="map" width="800" height="800" style="border: 1px solid #ffffff">
    Unlucky, canvas is disabled. No radar for you :(
  </canvas>
  <script charset="utf-8">
    const ws = new WebSocket("ws://localhost:13371");
    ws.onopen = () => {
      console.log("ws connection established :P");
    };

    let mapChunks;
    let mapInfo;
    let mapImage;
    let canvas = document.getElementById("map");
    let ctx = canvas.getContext("2d");

    ws.onmessage = async (message) => {
      let text = await message.data.text();

      let json = JSON.parse(text);
      let type = json.type;
      let data = json.data;

      // 3 kinds of messages:
      // - initMap
      // - mapChunk
      // - players
      if (type == "initMap") {
        mapInfo = data;
        mapChunks = {};
        return;
      } else if (type == "mapChunk") {
        if (!mapChunks) {
          mapChunks = {};
        }
        mapChunks[data.i] = data.data;
        return;
      } // else...

      let players = data;

      // reset the canvas
      //ctx.clearRect(0, 0, canvas.width, canvas.height);

      // draw the map, if we have all the chunks
      const drawMap = () => {
        if (mapImage) {
          ctx.drawImage(mapImage, 0, 0, canvas.width, canvas.height);
        } else if (mapInfo && mapChunks) {
          // unite all the chunks
          let mapBase64 = "";
          for (let i = 0; i < mapInfo.chunks; i++) {
            // if we don't that chunk, we can't draw the map yet
            if (!mapChunks[i]) {
              return;
            }
            mapBase64 += mapChunks[i];
          }

          // the image is jpg.
          // we can't draw jpgs directly, so we need to convert it to a png
          let img = new Image();
          img.onload = () => {
            ctx.drawImage(img, 0, 0, canvas.width, canvas.height);
          };
          img.src = `data:image/png;base64,${mapBase64}`;
          mapImage = img;
        }
      };
      drawMap();

      for (let i = 0; i < players.length; i++) {
        let player = players[i];
        // console.log(player);

        let color;
        if (player.is_local) {
          color = "#00FF0D";
        } else if (player.team == "T") {
          color = "#FF9D00";
        } else if (player.team == "CT") {
          color = "#3C00FF";
        } else {
          // idk
          color = "#1E1E1E";
        }
        ctx.fillStyle = color;
        let [x, y, _z] = player.position;
        // these positions are relative to the origin (the middle of the map).
        // the map's top left's x is at mapInfo.upper_left_x,
        // and the map's bottom right's x is at mapInfo.bottom_right_x.
        // we need to scale the positions to the canvas size
        function scale(x) {
          return (x + 3000) / 6000;
        }

        // if health == 0, the player is dead
        if (player.health == 0) {
          continue;
        }

        // draw rect, with health on the top
        ctx.fillRect(scale(x) * canvas.width, scale(y) * canvas.height, 15, 15);
        ctx.fillStyle = "#000000";
        let text = `HP: ${player.health}`;
        ctx.fillText(
          text,
          scale(x) * canvas.width,
          scale(y) * canvas.height - 30
        );
        let angle = player.ang_rotation[1];

        // we have an angle the player is looking at, so we can draw a line.
        // the angle is in the range of [-180, 180], so we need to convert it to radians
        angle = ((angle + 180) * Math.PI) / 180;
        let x2 = Math.cos(angle) * 100;
        let y2 = Math.sin(angle) * 100;
        ctx.beginPath();
        ctx.lineWidth = 4;
        ctx.moveTo(
          scale(x) * canvas.width + 7.5,
          scale(y) * canvas.height + 7.5
        );
        ctx.lineTo(
          scale(x - x2 * 1.5) * canvas.width + 7.5,
          scale(y - y2 * 1.5) * canvas.height + 7.5
        );
        ctx.stroke();
      }
    };
  </script>
</html>
